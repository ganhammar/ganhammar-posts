<text class="label soft" x="334" y="344.0">Drop</text>
<text class="detail mono soft" x="334" y="360.0">below 0.3</text>
<rect class="box soft" x="420" y="322" width="100" height="44"/>
<text class="label soft" x="434" y="344.0">Hold</text>
<text class="detail mono soft" x="434" y="360.0">0.3 to 0.7</text>
<path class="edge" d="M385,300 L385,308 L360,308 L360,322"/>
<path class="head" d="M356.4,316 L363.6,316 L360,322 Z"/>
<path class="edge" d="M415,300 L415,308 L470,308 L470,322"/>
