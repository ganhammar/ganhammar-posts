<text class="label" x="574" y="265.0">Rate cap, breaker</text>
<text class="detail mono" x="574" y="281.0">per repository, per hour</text>
<path class="edge accent" d="M450,265 L560,265"/>
<path class="head accent" d="M554,261.4 L554,268.6 L560,265 Z"/>
<text class="edge-label mono accent" x="505" y="259" text-anchor="middle">above 0.7</text>
<path class="edge accent" d="M760,265 L900,265 L900,395 L135,395 L135,420"/>
<path class="head accent" d="M131.4,414 L138.6,414 L135,420 Z"/>
<text class="edge-label mono accent" x="890" y="257" text-anchor="end">escalate</text>
<rect class="box" x="40" y="420" width="200" height="60"/>
<text class="label" x="54" y="450.0">GitHub Contents API</text>
<text class="detail mono" x="54" y="466.0">named in the trace, from main</text>
<rect class="box accent" x="270" y="420" width="200" height="60"/>
<text class="label accent" x="284" y="450.0">Verify each frame</text>
<text class="detail mono accent" x="284" y="466.0">qwen3-4b, could it throw here</text>
<rect class="box" x="500" y="420" width="200" height="60"/>
<text class="label" x="514" y="450.0">Nova 2 Lite</text>
<text class="detail mono" x="514" y="466.0">root cause, three sentences</text>
<path class="box" d="M730,420 h178 l12,12 v48 h-190 z"/>
<path class="box" d="M908,420 v12 h12"/>
<text class="label" x="744" y="450.0">GitHub issue</text>
<text class="detail mono" x="744" y="466.0">in the named repository</text>
<path class="edge" d="M240,450 L270,450"/>
<path class="head" d="M264,446.4 L264,453.6 L270,450 Z"/>
<path class="edge" d="M470,450 L500,450"/>
<path class="head" d="M494,446.4 L494,453.6 L500,450 Z"/>
<path class="edge" d="M700,450 L730,450"/>
<path class="head" d="M724,446.4 L724,453.6 L730,450 Z"/>
</svg>