<svg xmlns="http://www.w3.org/2000/svg" id="s1-arch" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Log triage pipeline from CloudWatch Logs to a GitHub issue">
<style>
  /* Every rule is scoped to the root id, because the site inlines this file and an
     inline style block is document-wide. Colours come from the site's tokens when
     inlined, with the light palette as the fallback for a standalone render. */
  #s1-arch {
    --d-paper: var(--paper, #fbfbf9);
    --d-ink: var(--ink, #14161a);
    --d-ink-2: var(--ink-2, #565b62);
    --d-ink-3: var(--ink-3, #9ba1a7);
    --d-accent: var(--accent, #c8321e);
    --d-plate: var(--code-inline-bg, #f1f0ec);
    --d-label: var(--label, "Avenir Next Condensed", "Helvetica Neue", system-ui, sans-serif);
    --d-mono: var(--mono, ui-monospace, "SF Mono", Menlo, monospace);
  }
  @media (prefers-color-scheme: dark) {
    #s1-arch {
      --d-paper: var(--paper, #15171a);
      --d-ink: var(--ink, #e6e4df);
      --d-ink-2: var(--ink-2, #a5a29b);
      --d-ink-3: var(--ink-3, #6e6c67);
      --d-accent: var(--accent, #e8674e);
      --d-plate: var(--code-inline-bg, #23262b);
    }
  }
  #s1-arch text { font-family: var(--d-label); }
  #s1-arch .mono { font-family: var(--d-mono); }
  #s1-arch .bg { fill: var(--d-paper); }
  #s1-arch .box { fill: var(--d-paper); stroke: var(--d-ink); stroke-width: 1; }
  #s1-arch .box.accent { stroke: var(--d-accent); stroke-width: 1.4; }
  #s1-arch .box.soft { fill: var(--d-plate); stroke: var(--d-ink-3); stroke-width: .8; }
  #s1-arch .container { fill: none; stroke: var(--d-ink-3); stroke-width: .8; stroke-dasharray: 5 4; }
  #s1-arch .label { letter-spacing: .14em; fill: var(--d-ink); font-size: 13.5px; text-transform: uppercase; }
  #s1-arch .label.accent { fill: var(--d-accent); }
  #s1-arch .label.soft { fill: var(--d-ink-2); font-size: 11.5px; }
  #s1-arch .detail { letter-spacing: .05em; fill: var(--d-ink-3); font-size: 9.6px; }
  #s1-arch .detail.accent { fill: var(--d-accent); }
  #s1-arch .title { letter-spacing: .26em; fill: var(--d-ink-3); font-size: 9.6px; }
  #s1-arch .edge { fill: none; stroke: var(--d-ink-2); stroke-width: .8; }
  #s1-arch .edge.accent { stroke: var(--d-accent); }
  #s1-arch .head { fill: var(--d-ink-2); }
  #s1-arch .head.accent { fill: var(--d-accent); }
  #s1-arch .edge-label { letter-spacing: .08em; fill: var(--d-ink-3); font-size: 9.2px; }
  #s1-arch .edge-label.accent { fill: var(--d-accent); }
  #s1-arch .readout { letter-spacing: .1em; fill: var(--d-accent); font-size: 10.5px; }
</style>
<rect class="bg" x="0" y="0" width="960" height="520"/>
<rect class="box" x="40" y="60" width="190" height="60"/>
<text class="label" x="54" y="90.0">CloudWatch Logs</text>
<text class="detail mono" x="54" y="106.0">account-level subscription</text>
<rect class="box" x="270" y="60" width="160" height="60"/>
<text class="label" x="284" y="90.0">Kinesis stream</text>
<text class="detail mono" x="284" y="106.0">every error marker</text>
<rect class="box" x="470" y="60" width="190" height="60"/>
<text class="label" x="484" y="90.0">Lambda, native AOT</text>
<text class="detail mono" x="484" y="106.0">parse, fingerprint</text>
<path class="box" d="M720,67 a95.0,7 0 0 1 190,0 v46 a95.0,7 0 0 1 -190,0 z"/>
<path class="box" d="M720,67 a95.0,7 0 0 0 190,0"/>
<text class="label" x="734" y="92.0">DynamoDB</text>
<text class="detail mono" x="734" y="108.0">sightings per fingerprint</text>
<path class="edge" d="M230,90 L270,90"/>
<path class="head" d="M264,86.4 L264,93.6 L270,90 Z"/>
<path class="edge" d="M430,90 L470,90"/>
